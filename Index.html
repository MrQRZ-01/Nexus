
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;

            background: radial-gradient(
                circle at center,
                #252535 0%,
                #15151f 45%,
                #08080d 100%
            );

            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main navigation container */

        .navigation {
            position: relative;
            width: min(90vw, 560px);
            aspect-ratio: 1 / 1;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Center circle - Not clickable */

        .center-circle {
            width: 130px;
            height: 130px;

            border-radius: 50%;
            position: absolute;
            z-index: 2;

            background: rgba(147, 51, 234, 0.65);
            border: 2px solid rgba(216, 180, 254, 0.8);

            box-shadow:
                0 0 30px rgba(147, 51, 234, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.15);
        }

        /* Surrounding glass buttons */

        .nav-button {
            position: absolute;

            width: 70px;
            height: 70px;

            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.5);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                inset 0 0 15px rgba(255, 255, 255, 0.2),
                0 4px 20px rgba(0, 0, 0, 0.3);

            cursor: pointer;

            transition:
                transform 0.3s ease,
                filter 0.3s ease;
        }

        /* Individual button colors */

        .nav-button:nth-child(2) {
            background: rgba(255, 80, 80, 0.55);
        }

        .nav-button:nth-child(3) {
            background: rgba(60, 150, 255, 0.55);
        }

        .nav-button:nth-child(4) {
            background: rgba(70, 220, 150, 0.55);
        }

        .nav-button:nth-child(5) {
            background: rgba(190, 100, 255, 0.55);
        }

        .nav-button:nth-child(6) {
            background: rgba(255, 180, 60, 0.55);
        }

        /* Circular positioning - 72 degrees apart */

        .nav-button:nth-child(2) {
            transform: rotate(0deg) translateY(-175px);
        }

        .nav-button:nth-child(3) {
            transform: rotate(72deg) translateY(-175px);
        }

        .nav-button:nth-child(4) {
            transform: rotate(144deg) translateY(-175px);
        }

        .nav-button:nth-child(5) {
            transform: rotate(216deg) translateY(-175px);
        }

        .nav-button:nth-child(6) {
            transform: rotate(288deg) translateY(-175px);
        }

        /* Hover effects */

        .nav-button:hover {
            filter: brightness(1.3);
        }

        .nav-button:nth-child(2):hover {
            transform: rotate(0deg) translateY(-175px) scale(1.1);
        }

        .nav-button:nth-child(3):hover {
            transform: rotate(72deg) translateY(-175px) scale(1.1);
        }

        .nav-button:nth-child(4):hover {
            transform: rotate(144deg) translateY(-175px) scale(1.1);
        }

        .nav-button:nth-child(5):hover {
            transform: rotate(216deg) translateY(-175px) scale(1.1);
        }

        .nav-button:nth-child(6):hover {
            transform: rotate(288deg) translateY(-175px) scale(1.1);
        }

        /* Responsive design */

        @media (max-width: 500px) {

            .center-circle {
                width: 105px;
                height: 105px;
            }

            .nav-button {
                width: 58px;
                height: 58px;
            }

            .nav-button:nth-child(2),
            .nav-button:nth-child(2):hover {
                transform: rotate(0deg) translateY(-125px);
            }

            .nav-button:nth-child(3),
            .nav-button:nth-child(3):hover {
                transform: rotate(72deg) translateY(-125px);
            }

            .nav-button:nth-child(4),
            .nav-button:nth-child(4):hover {
                transform: rotate(144deg) translateY(-125px);
            }

            .nav-button:nth-child(5),
            .nav-button:nth-child(5):hover {
                transform: rotate(216deg) translateY(-125px);
            }

            .nav-button:nth-child(6),
            .nav-button:nth-child(6):hover {
                transform: rotate(288deg) translateY(-125px);
            }
        }

    </style>
</head>

<body>

    <div class="navigation">

        <div class="center-circle"></div>

        <button class="nav-button" aria-label="Navigation 1"></button>
        <button class="nav-button" aria-label="Navigation 2"></button>
        <button class="nav-button" aria-label="Navigation 3"></button>
        <button class="nav-button" aria-label="Navigation 4"></button>
        <button class="nav-button" aria-label="Navigation 5"></button>

    </div>

</body>
</html>
