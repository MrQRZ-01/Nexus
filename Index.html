
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
        }

        .main {
            position: relative;
            isolation: isolate;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #050505;
        }

        .main [data-aifx="liquid-metal"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <main class="main">

        <!-- Liquid Metal Background -->
        <div
            data-aifx="liquid-metal"
            data-aifx-speed="0.25"
            data-aifx-mouse="0"
            aria-hidden="true"
        ></div>

    </main>

    <!-- AIDesigner Runtime -->
    <script src="https://cdn.aidesigner.ai/effects/runtime/v1.js" defer></script>

</body>
</html>
