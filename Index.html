
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
        }

        .smoke-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background: #050505;
        }

        .smoke-background [data-aifx="fluid-smoke"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <main class="smoke-background">

        <div
            data-aifx="fluid-smoke"
            data-aifx-bg="#050505"
            data-aifx-speed="0.25"
            data-aifx-scale="1.25"
            data-aifx-warp="0.7"
            data-aifx-swirl="0.2"
            data-aifx-contrast="1.5"
            data-aifx-softness="0.85"
            data-aifx-mouse="0.1"
            aria-hidden="true"
        ></div>

    </main>

    <script src="https://cdn.aidesigner.ai/effects/runtime/v1.js" defer></script>

</body>
</html>
