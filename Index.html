
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #050505;
            font-family: Arial, sans-serif;
        }

        .main {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            isolation: isolate;
            overflow: hidden;
            background: #050505;
        }

        .navigation {
            position: relative;
            width: min(90vw, 560px);
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Center profile image */

        .center-circle {
            position: absolute;
            width: 150px;
            height: 150px;
            z-index: 2;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(190, 202, 218, 0.8);
            box-shadow:
                0 0 20px rgba(190, 202, 218, 0.12),
                inset 0 0 12px rgba(255, 255, 255, 0.12);
        }

        .center-circle img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
        }

        /* Navigation buttons */

        .nav-button {
            position: absolute;
            width: 82px;
            height: 82px;
            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;
            border: 1px solid rgba(190, 202, 218, 0.65);

            background: rgba(89, 101, 117, 0.78);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);

            color: #f0f2f5;
            font-size: 12px;
            letter-spacing: 1px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.35),
                inset 0 1px 2px rgba(255, 255, 255, 0.25),
                inset 0 -5px 12px rgba(0, 0, 0, 0.18);

            cursor: pointer;
            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;

            z-index: 1;
            overflow: hidden;
            padding: 0;
            text-decoration: none;
        }

        .nav-button::before {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
            z-index: 2;
        }

        /* Images inside navigation buttons */

        .nav-button img {
            display: block;
            width: 75%;
            height: 75%;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            pointer-events: none;
        }

        .nav-button:hover {
            background: rgba(112, 126, 145, 0.9);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.45),
                0 0 18px rgba(190, 202, 218, 0.18),
                inset 0 1px 3px rgba(255, 255, 255, 0.3);
        }

        /* Five evenly distributed buttons */

        /* Top - Email */

        .nav-button--top {
            transform: rotate(0deg) translateY(-175px) rotate(0deg);
        }

        /* Bottom Right - GitHub */

        .nav-button--github {
            transform: rotate(72deg) translateY(-175px) rotate(-72deg);
        }

        /* Bottom Left - Resume */

        .nav-button--resume {
            transform: rotate(144deg) translateY(-175px) rotate(-144deg);
        }

        /* Middle Left */

        .nav-button--left {
            transform: rotate(216deg) translateY(-175px) rotate(-216deg);
        }

        /* Middle Right - Telegram */

        .nav-button--email {
            transform: rotate(288deg) translateY(-175px) rotate(-288deg);
        }

        /* Hover effects */

        .nav-button--top:hover {
            transform: rotate(0deg) translateY(-175px) rotate(0deg) scale(1.1);
        }

        .nav-button--github:hover {
            transform: rotate(72deg) translateY(-175px) rotate(-72deg) scale(1.1);
        }

        .nav-button--resume:hover {
            transform: rotate(144deg) translateY(-175px) rotate(-144deg) scale(1.1);
        }

        .nav-button--left:hover {
            transform: rotate(216deg) translateY(-175px) rotate(-216deg) scale(1.1);
        }

        .nav-button--email:hover {
            transform: rotate(288deg) translateY(-175px) rotate(-288deg) scale(1.1);
        }

        /* =========================
           EMAIL MODAL
        ========================= */

        .email-overlay {
            position: fixed;
            inset: 0;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.70);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.35s ease,
                visibility 0.35s ease;
        }

        .email-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .email-modal {
            width: 100%;
            max-width: 410px;
            position: relative;

            padding: 42px 30px 32px;
            text-align: center;

            border-radius: 24px;
            border: 1px solid rgba(210, 205, 235, 0.22);

            background: linear-gradient(
                145deg,
                rgba(45, 43, 57, 0.88),
                rgba(12, 12, 18, 0.94)
            );

            box-shadow:
                0 20px 80px rgba(0, 0, 0, 0.65),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);

            transform: translateY(25px) scale(0.94);

            transition:
                transform 0.4s cubic-bezier(.2, .8, .2, 1);
        }

        .email-overlay.active .email-modal {
            transform: translateY(0) scale(1);
        }

        /* Close button */

        .close-modal {
            position: absolute;
            top: 15px;
            right: 17px;

            width: 32px;
            height: 32px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.7);

            font-size: 21px;
            cursor: pointer;

            transition: 0.25s;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.16);
            color: white;
            transform: rotate(90deg);
        }

        /* Email icon */

        .email-icon {
            width: 66px;
            height: 66px;
            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            border: 1px solid rgba(205, 190, 255, 0.35);

            background: rgba(150, 125, 220, 0.12);

            box-shadow:
                0 0 30px rgba(145, 110, 230, 0.18);
        }

        .email-icon svg {
            width: 31px;
            height: 31px;
            fill: none;
            stroke: #d6c9ff;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Modal text */

        .email-modal h2 {
            font-size: 23px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #f0edf8;
        }

        .email-description {
            font-size: 13px;
            line-height: 1.7;
            color: rgba(225, 220, 240, 0.60);
            margin-bottom: 26px;
        }

        /* Email address */

        .email-address {
            padding: 14px 10px;
            margin-bottom: 22px;

            border-radius: 12px;
            border: 1px solid rgba(220, 215, 240, 0.13);

            background: rgba(255, 255, 255, 0.045);

            color: #e5ddff;
            font-size: 14px;
            word-break: break-all;
        }

        /* Email actions */

        .email-actions {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .email-action {
            width: 100%;
            padding: 13px;

            border-radius: 12px;
            border: 1px solid rgba(210, 200, 240, 0.2);

            font-size: 13px;
            letter-spacing: 1px;

            cursor: pointer;
            transition: 0.3s;
        }

        .copy-button {
            color: #eee8ff;
            background: rgba(155, 130, 220, 0.17);
        }

        .copy-button:hover {
            background: rgba(155, 130, 220, 0.30);
            box-shadow: 0 0 20px rgba(150, 120, 230, 0.15);
        }

        .send-button {
            color: #17141e;
            background: linear-gradient(
                110deg,
                #d9d1ed,
                #aaa0c9
            );
            border: none;
        }

        .send-button:hover {
            filter: brightness(1.13);
            box-shadow: 0 0 22px rgba(190, 175, 235, 0.22);
        }

        /* Copy message */

        .copy-message {
            height: 16px;
            margin-top: 12px;
            font-size: 11px;
            color: #c9b9ff;
            opacity: 0;
            transition: opacity 0.25s;
        }

        .copy-message.show {
            opacity: 1;
        }

        /* Footer */

        .email-footer {
            margin-top: 25px;
            font-size: 11px;
            letter-spacing: 0.4px;
            color: rgba(220, 215, 235, 0.42);
        }

        /* Mobile */

        @media (max-width: 600px) {

            .center-circle {
                width: 120px;
                height: 120px;
            }

            .nav-button {
                width: 68px;
                height: 68px;
                font-size: 10px;
            }

            .nav-button--top {
                transform: rotate(0deg) translateY(-125px) rotate(0deg);
            }

            .nav-button--github {
                transform: rotate(72deg) translateY(-125px) rotate(-72deg);
            }

            .nav-button--resume {
                transform: rotate(144deg) translateY(-125px) rotate(-144deg);
            }

            .nav-button--left {
                transform: rotate(216deg) translateY(-125px) rotate(-216deg);
            }

            .nav-button--email {
                transform: rotate(288deg) translateY(-125px) rotate(-288deg);
            }

            /* Mobile hover effects */

            .nav-button--top:hover {
                transform: rotate(0deg) translateY(-125px) rotate(0deg) scale(1.1);
            }

            .nav-button--github:hover {
                transform: rotate(72deg) translateY(-125px) rotate(-72deg) scale(1.1);
            }

            .nav-button--resume:hover {
                transform: rotate(144deg) translateY(-125px) rotate(-144deg) scale(1.1);
            }

            .nav-button--left:hover {
                transform: rotate(216deg) translateY(-125px) rotate(-216deg) scale(1.1);
            }

            .nav-button--email:hover {
                transform: rotate(288deg) translateY(-125px) rotate(-288deg) scale(1.1);
            }

            .email-modal {
                max-width: 350px;
                padding: 38px 22px 27px;
            }
        }

    </style>
</head>

<body>

    <main class="main">

        <!-- Liquid Metal Background -->

        <div
            data-aifx="liquid-metal"
            data-aifx-speed="0.25"
            data-aifx-mouse="0"
            style="
                position: absolute;
                inset: 0;
                z-index: -1;
            "
        ></div>

        <!-- Navigation -->

        <div class="navigation">

            <!-- Center Profile Image -->

            <div class="center-circle">
                <img
                    src="Assets/file_00000000577c820aa374caf6c67715aa.png"
                    alt="Nexus"
                >
            </div>

            <!-- Top - Email -->

            <button
                class="nav-button nav-button--top"
                id="emailButton"
                type="button"
                aria-label="Email"
            >
                <img
                    src="Assets/IMG_db45c11d-e28c-4dd8-95da-6f7f124c09cc.png"
                    alt="Email"
                >
            </button>

            <!-- Bottom Right - GitHub -->

            <button
                class="nav-button nav-button--github"
                type="button"
                aria-label="GitHub"
                onclick="window.open('https://github.com/MrQRZ-01', '_blank', 'noopener,noreferrer')"
            >
                <img
                    src="Assets/IMG_6fe6a0f1-5c10-452c-b111-042d007111ef-removebg-preview.png"
                    alt="GitHub"
                >
            </button>

            <!-- Bottom Left - Resume -->

            <button
                class="nav-button nav-button--resume"
                type="button"
                aria-label="Resume"
                onclick="window.open('https://mrqrz-01.github.io/Resume/Asset/Resume.pdf', '_blank', 'noopener,noreferrer')"
            >
                <img
                    src="Assets/IMG_2f2a3861-0c96-4c0e-a4e1-b316c691cf65-removebg-preview.png"
                    alt="Resume"
                >
            </button>

            <!-- Middle Left -->

            <button
                class="nav-button nav-button--left"
                type="button"
                aria-label="Navigation 4"
            >
                <img
                    src="Assets/IMG_a0c033b3-e98e-469d-91c4-77e73788eeae-removebg-preview.png"
                    alt="Navigation 4"
                >
            </button>

            <!-- Middle Right - Telegram -->

            <button
                class="nav-button nav-button--email"
                type="button"
                aria-label="Telegram"
                onclick="window.open('https://t.me/Noone6201', '_blank', 'noopener,noreferrer')"
            >
                <img
                    src="Assets/IMG_13e736d6-caf9-47fa-84be-ae8eab985e94-removebg-preview.png"
                    alt="Telegram"
                >
            </button>

        </div>

    </main>


    <!-- =========================
         EMAIL MODAL
    ========================== -->

    <div
        class="email-overlay"
        id="emailOverlay"
        aria-hidden="true"
    >

        <div
            class="email-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="emailTitle"
        >

            <!-- Close -->

            <button
                class="close-modal"
                id="closeEmail"
                type="button"
                aria-label="Close"
            >
                &times;
            </button>

            <!-- Email Icon -->

            <div class="email-icon">

                <svg viewBox="0 0 24 24">
                    <rect
                        x="2.5"
                        y="4.5"
                        width="19"
                        height="15"
                        rx="2"
                    />
                    <path d="M3.5 6L12 13L20.5 6" />
                </svg>

            </div>

            <!-- Text -->

            <h2 id="emailTitle">
                
            </h2>

            <p class="email-description">
            
            </p>

            <!-- Email Address -->

            <div
                class="email-address"
                id="emailAddress"
            >
                Mr.QRZ6101@gmail.com
            </div>

            <!-- Actions -->

            <div class="email-actions">

                <button
                    class="email-action copy-button"
                    id="copyEmail"
                    type="button"
                >
                    Copy Email
                </button>

                <button
                    class="email-action send-button"
                    id="sendEmail"
                    type="button"
                >
                    Send Email
                </button>

            </div>

            <!-- Copy Feedback -->

            <div
                class="copy-message"
                id="copyMessage"
                aria-live="polite"
            >
                Email copied successfully
            </div>

            <!-- Footer -->

            <div class="email-footer">
                
            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // Email configuration

        const MY_EMAIL = "Mr.QRZ6101@gmail.com";


        // Elements

        const emailButton = document.getElementById("emailButton");

        const emailOverlay = document.getElementById("emailOverlay");

        const closeEmail = document.getElementById("closeEmail");

        const copyEmail = document.getElementById("copyEmail");

        const sendEmail = document.getElementById("sendEmail");

        const copyMessage = document.getElementById("copyMessage");


        // Display email address

        document.getElementById("emailAddress").textContent = MY_EMAIL;


        // Open email modal

        function openEmailModal() {

            emailOverlay.classList.add("active");

            emailOverlay.setAttribute("aria-hidden", "false");

            document.body.style.overflow = "hidden";

            closeEmail.focus();

        }


        // Close email modal

        function closeEmailModal() {

            emailOverlay.classList.remove("active");

            emailOverlay.setAttribute("aria-hidden", "true");

            document.body.style.overflow = "";

            copyMessage.classList.remove("show");

            emailButton.focus();

        }


        // Open

        emailButton.addEventListener("click", openEmailModal);


        // Close button

        closeEmail.addEventListener("click", closeEmailModal);


        // Close by clicking outside modal

        emailOverlay.addEventListener("click", function(event) {

            if (event.target === emailOverlay) {

                closeEmailModal();

            }

        });


        // Close with Escape key

        document.addEventListener("keydown", function(event) {

            if (
                event.key === "Escape" &&
                emailOverlay.classList.contains("active")
            ) {

                closeEmailModal();

            }

        });


        // Copy email address

        copyEmail.addEventListener("click", async function() {

            try {

                await navigator.clipboard.writeText(MY_EMAIL);

                copyMessage.textContent = "Email copied successfully";

                copyMessage.classList.add("show");

                copyEmail.textContent = "Copied!";

                setTimeout(function() {

                    copyEmail.textContent = "Copy Email";

                }, 1800);

            } catch (error) {

                // Fallback for browsers without Clipboard API access

                const temporaryInput = document.createElement("textarea");

                temporaryInput.value = MY_EMAIL;

                temporaryInput.style.position = "fixed";

                temporaryInput.style.opacity = "0";

                document.body.appendChild(temporaryInput);

                temporaryInput.select();

                const successful = document.execCommand("copy");

                temporaryInput.remove();

                if (successful) {

                    copyMessage.textContent = "Email copied successfully";

                } else {

                    copyMessage.textContent = "Please copy the email manually";

                }

                copyMessage.classList.add("show");

            }

        });


        // Open default email application

        sendEmail.addEventListener("click", function() {

            const subject = encodeURIComponent("Hello from NEXUS");

            window.location.href =
                "mailto:" + MY_EMAIL + "?subject=" + subject;

        });

    </script>


    <!-- Liquid Metal Runtime -->

    <script
        src="https://cdn.aidesigner.ai/effects/runtime/v1.js"
        defer
    ></script>

</body>
</html>
